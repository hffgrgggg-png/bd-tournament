<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BD Tournament</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06130f;color:#f5fff8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#071a14,#06130f)}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #174032;position:sticky;top:0;background:#071a14f2;backdrop-filter:blur(10px);z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:#13c965;display:grid;place-items:center;font-size:23px}.brand b{font-size:19px}.brand small{display:block;color:#91b2a2;font-size:11px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#15d76a;font-weight:900;color:#032013}.ghost{background:#0d271f;color:#bfe5d2;border:1px solid #1b4939}main{padding:14px 14px 90px}.hero{padding:18px;border:1px solid #1d5c46;border-radius:22px;background:radial-gradient(circle at 90% 0,#178c4d66,transparent 45%),#0a241b}.hero h1{font-size:28px;margin:0 0 6px}.muted{color:#9bb9aa;font-size:13px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.game{padding:13px 7px;border:1px solid #183f33;border-radius:17px;background:#0b241c;text-align:center;cursor:pointer}.game.active{border-color:#20d975;background:#0e3325}.game span{font-size:27px;display:block}.game b{font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:17px;margin:0}.tabs{display:flex;gap:8px;overflow:auto}.tab{border:1px solid #194235;background:#0b211a;color:#a9c7b9;border-radius:999px;padding:8px 14px}.tab.active{background:#15d76a;color:#042013;font-weight:800}.tour{margin:10px 0;padding:14px;border:1px solid #194538;border-radius:18px;background:#0b211a}.tourtop{display:flex;gap:11px}.cover{width:56px;height:56px;border-radius:14px;background:#124331;display:grid;place-items:center;font-size:28px}.tour h3{margin:0 0 5px;font-size:14px}.meta{font-size:11px;color:#9bb8aa;line-height:1.6}.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.count{color:#65e99a}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.sheet{width:min(520px,100%);background:#0a2018;border:1px solid #194638;border-radius:23px 23px 0 0;padding:20px}.sheet h2{margin:0 0 14px}.input{width:100%;padding:12px;margin:7px 0;border-radius:11px;border:1px solid #1b4939;background:#06130f;color:#fff}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:66px;background:#071a14f7;border-top:1px solid #173f32;display:flex;justify-content:space-around;align-items:center;z-index:8}.nav{text-align:center;color:#77988a;font-size:10px;cursor:pointer}.nav b{display:block;font-size:20px}.nav.active{color:#45ed8d}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#14c966;color:#032013;padding:11px 15px;border-radius:12px;font-weight:800;display:none;z-index:30}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">🏆</div><div><b>BD Tournament</b><small>PLAY • COMPETE • WIN</small></div></div><button class="btn ghost" onclick="openAuth()">👤</button></header>
<main>
<section class="hero"><h1>টুর্নামেন্ট খেলুন</h1><div class="muted">Free Fire, Ludo ও Carrom—এক অ্যাপে আপনার ম্যাচ ম্যানেজ করুন।</div><div style="margin-top:13px;color:#72f3aa;font-size:12px">● LIVE TOURNAMENTS</div></section>
<div class="section"><h2>গেম বেছে নিন</h2><span class="count">সবগুলো দেখুন</span></div>
<div class="games"><div class="game active" onclick="choose('Free Fire',this)"><span>🎯</span><b>Free Fire</b></div><div class="game" onclick="choose('Ludo',this)"><span>🎲</span><b>Ludo</b></div><div class="game" onclick="choose('Carrom',this)"><span>🏹</span><b>Carrom</b></div></div>
<div class="section"><h2 id="title">Free Fire টুর্নামেন্ট</h2><span class="count" id="n"></span></div>
<div class="tabs"><button class="tab active" onclick="setFilter('all',this)">সব</button><button class="tab" onclick="setFilter('live',this)">Live</button><button class="tab" onclick="setFilter('upcoming',this)">Upcoming</button></div>
<div id="list"></div>
</main>
<div class="bottom"><div class="nav active"><b>⌂</b>Home</div><div class="nav" onclick="loadMy()"><b>🏆</b>My Tournaments</div><div class="nav" onclick="openAuth()"><b>＋</b>Account</div><div class="nav" onclick="openAuth()"><b>👤</b>Profile</div></div>
</div><div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn ghost" style="float:right" onclick="closeModal()">×</button><h2 id="mtitle">Login</h2><div id="mbody"></div></div></div>
<script>
let game="Free Fire",filter="all",token=localStorage.getItem("bd_token");
const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body)opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function choose(g,el){game=g;document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));el.classList.add("active");load()}
function setFilter(f,el){filter=f;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");load()}
async function load(){let a=await api("/api/tournaments?game="+encodeURIComponent(game));if(filter!="all")a=a.filter(x=>x.status==filter);$("title").textContent=game+" টুর্নামেন্ট";$("n").textContent=a.length+"টি";$("list").innerHTML=a.length?a.map(t=>`<div class="tour"><div class="tourtop"><div class="cover">${game=="Free Fire"?"🎯":game=="Ludo"?"🎲":"🏹"}</div><div style="flex:1"><h3>${t.name}</h3><div class="meta">📅 ${t.date} • ⏰ ${t.time}<br>👥 ${t.joined}/${t.maxPlayers} প্লেয়ার</div></div></div><div class="row"><b style="color:#ffc83d">FREE ENTRY</b><button class="btn" onclick="join(${t.id})">JOIN NOW</button></div></div>`).join(""):"<div class='tour' style='text-align:center;color:#9bb8aa'>এই ক্যাটাগরিতে এখন কোনো টুর্নামেন্ট নেই।</div>"}
async function join(id){if(!token)return openAuth("join");try{await api("/api/tournaments/"+id+"/join",{method:"POST"});toast("✓ Tournament joined successfully");load()}catch(e){toast(e.message)}}
function openAuth(mode){$("mtitle").textContent=token?"Profile":"Login / Register";$("mbody").innerHTML=token?`<p class="muted">আপনি লগইন করেছেন।</p><button class="btn" onclick="logout()">Logout</button>`:`<input class="input" id="name" placeholder="নাম (Register-এর জন্য)"><input class="input" id="email" placeholder="Email"><input class="input" id="pass" type="password" placeholder="Password (কমপক্ষে ৬ অক্ষর)"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="register()">Register</button><button class="btn ghost" onclick="login()">Login</button></div>`;$("modal").style.display="flex"}
async function register(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("name").value,email:$("email").value,password:$("pass").value})});token=d.token;localStorage.setItem("bd_token",token);closeModal();toast("✓ Registration successful")}catch(e){toast(e.message)}}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pass").value})});token=d.token;localStorage.setItem("bd_token",token);closeModal();toast("✓ Login successful")}catch(e){toast(e.message)}}
function logout(){token=null;localStorage.removeItem("bd_token");closeModal();toast("Logged out")}
async function loadMy(){if(!token)return openAuth();let a=await api("/api/my-tournaments");$("title").textContent="My Tournaments";$("n").textContent=a.length+"টি";$("list").innerHTML=a.length?a.map(t=>`<div class="tour"><h3>${t.name}</h3><div class="meta">${t.game} • ${t.date} • ${t.time}</div><div class="row"><b style="color:#65e99a">JOINED</b></div></div>`).join(""):"<div class='tour' style='text-align:center;color:#9bb8aa'>আপনি এখনো কোনো টুর্নামেন্ট জয়েন করেননি।</div>"}
load();
</script></body></html>
